services:
  - type: web
    name: empowernet-backend
    runtime: python
    plan: free 
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Placeholder for your Neon Postgres URL
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # NOTE: VERIFY_TOKEN was read by main.py's GET /webhook handshake
      # (os.getenv("VERIFY_TOKEN")) but was never actually declared here --
      # it would only have worked if set manually outside this file.
      - key: VERIFY_TOKEN
        sync: false
      # FIX (weak point #20): required for main.py/app/api/whatsapp.py's new
      # HMAC signature verification on incoming webhook POSTs. Set this to
      # your Meta App's "App Secret" (App Dashboard -> Settings -> Basic).
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0